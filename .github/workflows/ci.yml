name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aguachiles_pos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aguachiles_pos_test
      JWT_SECRET: ci-only-secret-value-not-used-in-production
      CORS_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - name: Validar esquema de Prisma
        run: npx prisma validate --schema apps/api/prisma/schema.prisma

      - name: Aplicar migraciones de Prisma (si existen)
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

      - run: npm run test

      - run: npm run build

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aguachiles_pos_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aguachiles_pos_e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Aplicar migraciones a la base de datos de E2E
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}

      - name: Sembrar datos base para E2E
        run: npx tsx apps/api/prisma/seed.ts
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/e2e

      - name: Ejecutar pruebas E2E (flujo completo de cajero)
        run: npm run test:e2e --workspace=@aguachiles/e2e

      - name: Subir reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
